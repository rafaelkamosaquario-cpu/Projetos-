name: Deploy gestao-frota to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/frota-7-5-analysis-d7w5xn
    paths:
      - 'gestao-frota/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gestao-frota
      - id: deployment
        uses: actions/deploy-pages@v4
